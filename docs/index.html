<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地政謄本辨識｜公開測試版</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">LAND REGISTRY OCR</p>
        <h1>地政謄本辨識</h1>
        <p class="lead">上傳 PDF 後交由後端辨識。公開前端不包含核心文字提取與欄位判斷邏輯。</p>
      </div>
      <span class="badge">GitHub Pages 測試版</span>
    </section>

    <section class="card">
      <label class="label" for="apiBase">後端 API 網址</label>
      <div class="api-row">
        <input id="apiBase" type="url" placeholder="https://your-api.example.com" autocomplete="off" />
        <button id="saveApi" class="secondary" type="button">儲存</button>
      </div>
      <p class="hint">目前前後端分離。後端完成部署後，只要把網址填在這裡即可連線測試。</p>
    </section>

    <section class="card upload-card">
      <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden />
      <button id="pickFile" class="dropzone" type="button">
        <strong>選擇地政謄本 PDF</strong>
        <span>或將檔案拖曳到這裡</span>
        <small>測試版限制：單檔 20MB 以內</small>
      </button>

      <div id="fileInfo" class="file-info hidden"></div>

      <div class="actions">
        <button id="recognize" class="primary" type="button" disabled>開始辨識</button>
        <button id="clear" class="secondary" type="button" disabled>清除</button>
      </div>
    </section>

    <section id="statusCard" class="card hidden" aria-live="polite">
      <div class="status-line">
        <span id="statusDot" class="status-dot"></span>
        <strong id="statusText">等待中</strong>
      </div>
      <p id="statusDetail" class="hint"></p>
    </section>

    <section id="resultCard" class="card hidden">
      <div class="section-head">
        <h2>辨識結果</h2>
        <button id="copyResult" class="secondary" type="button">複製 JSON</button>
      </div>
      <pre id="result"></pre>
    </section>

    <footer>
      <p>隱私設計：正式版預計僅暫存處理中的 PDF，完成辨識後刪除；前端不保存核心解析規則。</p>
    </footer>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
