services:
  - type: web
    name: land-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS
        value: https://awind74317-spec.github.io
      - key: MAX_FILE_BYTES
        value: 20971520
      - key: MAX_PAGES
        value: 200
