services:
  - type: web
    name: land-api
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: ALLOWED_ORIGINS
        value: https://awind74317-spec.github.io
      - key: MAX_FILE_BYTES
        value: 20971520
      - key: MAX_PAGES
        value: 200
